name: 臻海艺术公告监控

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟（GitHub 可能会延迟）
  workflow_dispatch:
    inputs:
      test_push:
        description: "发送一条测试推送"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 测试推送
        if: ${{ inputs.test_push }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py --test-push

      - name: 检查新公告
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py

      - name: 保存已查过的公告
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add seen_notices.json
          git diff --cached --quiet || (git commit -m "更新已查公告" && git push)
